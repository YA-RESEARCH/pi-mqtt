mqtt:
  broker: "172.16.20.4"
  port: 1883
  client_id: "pi-sensor-monitor"
  read_topic: "CO2Weld_K3/workstation/1/sensors/read"
  write_topic: "CO2Weld_K3/workstation/1/sensors/write"
  control_topic: "CO2Weld_K3/workstation/1/sensors/control"

serial:
  port: /dev/ttyUSB0
  baudrate: 9600
  parity: N
  stopbits: 1
  bytesize: 8
  timeout: 1

# 发布策略配置
polling_interval: 1              # 轮询间隔(秒)，默认1秒
force_publish_interval: 60       # 强制发布间隔(秒)，无论数据是否变化都会发布（心跳机制），默认60秒
change_threshold: 0.1            # 数值变化阈值，小于此值的变化不触发发布，默认0.1

sensors:
  angle_sensor_1:
    device_id: 80
    read:
      address: 61
      count: 2
      parser: "angle"
    
  env_sensor_1:
    device_id: 81
    read:
      address: 0
      count: 3
      parser: "environmental"
      
  voltage_current_output:
    device_id: 1
    write:
      address: 0x0056  # 第7路模拟量输出起始地址
      count: 2         # 2路输出：第1路电压，第2路电流
      parser: "analog_output"