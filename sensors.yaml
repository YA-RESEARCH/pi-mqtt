mqtt:
  broker: "172.16.20.4"
  port: 1883
  client_id: "pi-sensor-monitor"
  data_topic_prefix: "sensors/data"
  control_topic: "sensors/control"

serial:
  port: /dev/ttyUSB0
  baudrate: 9600
  parity: N
  stopbits: 1
  bytesize: 8
  timeout: 1

sensors:
  angle_sensor_1:
    device_id: 80
    address: 61
    count: 2
    parser: "angle"
  env_sensor_1:
    device_id: 81
    address: 0
    count: 3
    parser: "environmental"
